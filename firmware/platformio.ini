[platformio]
default_envs = esp32_wroom32

[env:esp32_wroom32]
platform = espressif32@6.10.0
; Generic classic ESP32 / 4 MB flash profile for the purchased 30-pin board.
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.3.6
build_flags = -Wall -Wextra
